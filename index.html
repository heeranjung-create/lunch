<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘 뭐 먹지?</title>
  <meta name="description" content="음식 종류를 고르면 오늘의 점심 메뉴를 추천해 주는 웹앱" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>" />
  <style>
    /* ===== 색상 설정: 여기서 색을 바꾸면 전체 분위기가 바뀌어요 ===== */
    :root {
      --bg: #fff8ec;          /* 크림색 배경 */
      --card: #ffffff;        /* 카드 배경 */
      --point: #ff8a3d;       /* 주황색 포인트 */
      --point-dark: #e8701f;  /* 진한 주황 (눌렀을 때) */
      --point-soft: #ffe7d4;  /* 연한 주황 */
      --text: #4a3a2c;        /* 기본 글자색 */
      --text-soft: #8a7663;   /* 보조 글자색 */
      --shadow: 0 8px 24px rgba(255, 138, 61, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      line-height: 1.6;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2rem, 7vw, 2.6rem);
      font-weight: 800;
      margin-bottom: 8px;
    }

    .intro {
      font-size: 1.05rem;
      color: var(--text-soft);
      margin-bottom: 28px;
      word-break: keep-all;
    }

    /* ----- 음식 종류 버튼 ----- */
    .categories {
      display: flex;
      flex-wrap: wrap;           /* 화면이 좁으면 자연스럽게 줄바꿈 */
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .category-btn {
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      min-height: 44px;
      padding: 8px 18px;
      border: 2px solid var(--point-soft);
      border-radius: 999px;
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
    }

    .category-btn:hover { border-color: var(--point); }
    .category-btn:active { transform: scale(0.95); }

    /* 선택된 버튼 */
    .category-btn.active {
      background: var(--point);
      border-color: var(--point);
      color: #fff;
      box-shadow: 0 4px 12px rgba(255, 138, 61, 0.35);
    }

    /* ----- 추천 버튼 ----- */
    .main-btn {
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      width: 100%;
      min-height: 56px;
      padding: 14px 20px;
      border: none;
      border-radius: 20px;
      background: var(--point);
      color: #fff;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 0.15s, background 0.15s;
    }

    .main-btn:hover { background: var(--point-dark); }
    .main-btn:active { transform: scale(0.97); }

    .category-btn:focus-visible,
    .main-btn:focus-visible {
      outline: 3px solid var(--text);
      outline-offset: 3px;
    }

    /* ----- 결과 카드 ----- */
    .result-card {
      margin: 28px 0 20px;
      padding: 36px 24px;
      min-height: 240px;
      background: var(--card);
      border-radius: 28px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .result-emoji {
      font-size: 5rem;
      line-height: 1.2;
    }

    .result-name {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--point-dark);
    }

    .result-category {
      display: inline-block;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 2px 12px;
      border-radius: 999px;
      background: var(--point-soft);
      color: var(--point-dark);
    }

    .result-desc {
      font-size: 1.05rem;
      color: var(--text-soft);
      word-break: keep-all;
      margin-top: 4px;
    }

    /* 결과가 나타날 때 통통 튀는 애니메이션 */
    .pop {
      animation: pop 0.45s ease-out;
    }

    @keyframes pop {
      0%   { opacity: 0; transform: scale(0.85) translateY(10px); }
      60%  { opacity: 1; transform: scale(1.04); }
      100% { transform: scale(1); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pop { animation: none; }
    }

    .retry-btn {
      background: var(--card);
      color: var(--point-dark);
      border: 2px solid var(--point);
    }
    .retry-btn:hover { background: var(--point-soft); }

    [hidden] { display: none !important; }

    @media (max-width: 400px) {
      body { padding: 28px 16px; }
      .category-btn { padding: 8px 14px; }
      .result-emoji { font-size: 4.2rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>오늘 뭐 먹지? 🍽️</h1>
    <p class="intro">음식 종류를 고르면 오늘의 점심을 추천해 드려요.</p>

    <!-- 음식 종류 버튼은 JavaScript가 자동으로 만들어요 -->
    <div class="categories" id="categories" role="group" aria-label="음식 종류 선택"></div>

    <button class="main-btn" id="recommendBtn" type="button">점심 메뉴 추천받기</button>

    <section class="result-card" id="resultCard" aria-live="polite">
      <div class="result-emoji">🤔</div>
      <p class="result-desc">오늘의 점심, 함께 골라볼까요?</p>
    </section>

    <button class="main-btn retry-btn" id="retryBtn" type="button" hidden>🔄 다시 추천</button>
  </main>

  <script>
    // =====================================================
    // ✏️ 메뉴 목록: 학생 여러분이 수정하는 곳이에요!
    //  - name: 메뉴 이름
    //  - category: 음식 종류 (한식 / 중식 / 일식 / 양식 / 분식 중 하나)
    //  - emoji: 메뉴를 나타내는 이모지
    //  - desc: 짧은 설명
    //  새 메뉴를 추가하려면 { ... } 한 줄을 복사해서 붙여넣고 내용을 바꾸세요.
    // =====================================================
    const MENUS = [
      // ----- 한식 -----
      { name: "김치찌개",   category: "한식", emoji: "🍲", desc: "얼큰하고 칼칼한 국물에 밥 한 공기 뚝딱!" },
      { name: "비빔밥",     category: "한식", emoji: "🥗", desc: "알록달록 나물과 고추장을 쓱쓱 비벼요." },
      { name: "불고기",     category: "한식", emoji: "🥩", desc: "달콤 짭짤한 양념 고기로 든든하게." },
      { name: "된장찌개",   category: "한식", emoji: "🥘", desc: "구수한 된장 향이 마음까지 따뜻하게." },
      { name: "삼계탕",     category: "한식", emoji: "🍗", desc: "뜨끈한 국물로 기운 충전!" },

      // ----- 중식 -----
      { name: "짜장면",     category: "중식", emoji: "🍜", desc: "고소하고 달콤한 춘장 소스의 국민 메뉴." },
      { name: "짬뽕",       category: "중식", emoji: "🌶️", desc: "해물 가득 얼큰한 빨간 국물." },
      { name: "탕수육",     category: "중식", emoji: "🍖", desc: "바삭한 튀김에 새콤달콤 소스를 곁들여요." },
      { name: "마파두부",   category: "중식", emoji: "🫕", desc: "부드러운 두부와 매콤한 소스의 조화." },
      { name: "볶음밥",     category: "중식", emoji: "🍳", desc: "불맛 가득 고슬고슬한 한 그릇." },

      // ----- 일식 -----
      { name: "초밥",       category: "일식", emoji: "🍣", desc: "신선한 생선을 한입에 쏙!" },
      { name: "라멘",       category: "일식", emoji: "🍥", desc: "진한 육수와 쫄깃한 면발." },
      { name: "돈카츠",     category: "일식", emoji: "🍱", desc: "겉은 바삭, 속은 촉촉한 돼지고기 커틀릿." },
      { name: "우동",       category: "일식", emoji: "🍜", desc: "통통한 면과 시원한 국물이 매력." },
      { name: "규동",       category: "일식", emoji: "🍚", desc: "달큰한 소고기 덮밥으로 간단하게." },

      // ----- 양식 -----
      { name: "파스타",     category: "양식", emoji: "🍝", desc: "토마토? 크림? 오늘은 면 요리 어때요?" },
      { name: "피자",       category: "양식", emoji: "🍕", desc: "치즈가 쭉 늘어나는 행복한 한 조각." },
      { name: "햄버거",     category: "양식", emoji: "🍔", desc: "두툼한 패티로 든든한 점심." },
      { name: "스테이크",   category: "양식", emoji: "🥩", desc: "오늘은 나에게 주는 특별한 선물!" },
      { name: "샌드위치",   category: "양식", emoji: "🥪", desc: "가볍고 신선하게 즐기는 한 끼." },

      // ----- 분식 -----
      { name: "떡볶이",     category: "분식", emoji: "🍢", desc: "쫄깃한 떡과 매콤달콤 소스의 단짝." },
      { name: "김밥",       category: "분식", emoji: "🍙", desc: "간편하게 먹는 알찬 한 줄." },
      { name: "라면",       category: "분식", emoji: "🍜", desc: "언제 먹어도 맛있는 꼬불꼬불 면." },
      { name: "튀김",       category: "분식", emoji: "🍤", desc: "바삭바삭 골라 먹는 재미!" },
      { name: "순대",       category: "분식", emoji: "🌭", desc: "쫀득한 식감에 소금 콕 찍어서." },
    ];

    // ✏️ 음식 종류 버튼 목록 (순서를 바꾸면 버튼 순서도 바뀌어요)
    const CATEGORIES = ["전체", "한식", "중식", "일식", "양식", "분식"];

    // ===== 아래부터는 동작 코드예요 =====
    let selectedCategory = "전체"; // 처음에는 '전체' 선택
    let lastMenu = null;           // 직전에 추천한 메뉴 (다시 추천할 때 제외)

    const categoriesEl = document.getElementById("categories");
    const recommendBtn = document.getElementById("recommendBtn");
    const retryBtn = document.getElementById("retryBtn");
    const resultCard = document.getElementById("resultCard");

    // 음식 종류 버튼 만들기
    CATEGORIES.forEach((category) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "category-btn";
      btn.textContent = category;
      btn.setAttribute("aria-pressed", category === selectedCategory);
      if (category === selectedCategory) btn.classList.add("active");

      btn.addEventListener("click", () => {
        selectedCategory = category;
        document.querySelectorAll(".category-btn").forEach((b) => {
          const isActive = b === btn;
          b.classList.toggle("active", isActive);
          b.setAttribute("aria-pressed", isActive);
        });
      });

      categoriesEl.appendChild(btn);
    });

    // 선택한 종류에서 메뉴 하나를 무작위로 고르기
    function pickMenu(excludeLast) {
      let candidates = selectedCategory === "전체"
        ? MENUS
        : MENUS.filter((menu) => menu.category === selectedCategory);

      // 다시 추천일 때는 직전 메뉴 제외 (후보가 2개 이상일 때만)
      if (excludeLast && lastMenu && candidates.length > 1) {
        candidates = candidates.filter((menu) => menu !== lastMenu);
      }

      if (candidates.length === 0) return null;
      return candidates[Math.floor(Math.random() * candidates.length)];
    }

    // 결과 카드에 메뉴 보여주기
    function showMenu(menu) {
      if (!menu) {
        resultCard.innerHTML = `
          <div class="result-emoji">😢</div>
          <p class="result-desc">이 종류에는 아직 메뉴가 없어요.</p>`;
        return;
      }

      resultCard.innerHTML = `
        <div class="result-emoji">${menu.emoji}</div>
        <span class="result-category">${menu.category}</span>
        <h2 class="result-name">${menu.name}</h2>
        <p class="result-desc">${menu.desc}</p>`;

      // 애니메이션을 매번 다시 실행하기
      resultCard.classList.remove("pop");
      void resultCard.offsetWidth;
      resultCard.classList.add("pop");

      lastMenu = menu;
      retryBtn.hidden = false;
    }

    recommendBtn.addEventListener("click", () => showMenu(pickMenu(false)));
    retryBtn.addEventListener("click", () => showMenu(pickMenu(true)));
  </script>
</body>
</html>
